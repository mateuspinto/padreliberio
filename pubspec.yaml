name: minapadreliberio
description: "Mina do Padre Libério — Web/WASM + Android + iOS app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  http: ^1.5.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_web: ^0.2.3+4
  youtube_player_flutter: ^10.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/qrcode_pix.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FAF3E7"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FAF3E7"
    theme_color: "#6E2532"
